name: tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Bun latest
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run the tests
        run: bun test --timeout 30000
        env:
          CI: true
          B2_ID: ${{ secrets.B2_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}
